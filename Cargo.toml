[workspace]
resolver = "2"
members = ["src-tauri", "crates/negative"]

# Pixel loops are unusably slow in unoptimized builds, so optimize the image
# core and all dependencies even in dev. App glue stays fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.negative]
opt-level = 3

[profile.release]
lto = "thin"
