[package]
name = "contactsheet"
version = "0.1.0"
description = "Film negative inversion"
edition = "2021"

[lib]
name = "contactsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
negative = { path = "../crates/negative" }
