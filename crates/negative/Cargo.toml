[package]
name = "negative"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/famoraes/contactsheet"
description = "Film negative inversion core: TIFF/RAW decode, analysis, positive rendering, export"

[dependencies]
tiff = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
# Camera RAW / DNG input. LGPL-2.1: see README before distributing binaries.
rawler = { version = "0.8", optional = true }

[features]
default = ["raw"]
raw = ["dep:rawler"]
