[package]
name = "negative"
version = "0.1.0"
edition = "2021"
description = "Film negative inversion core: TIFF decode, analysis, positive rendering, export"

[dependencies]
tiff = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
